# ============================================================================
# 生产环境 Docker Compose — 阿里云 ECS 部署
# 使用: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:5.7
    container_name: equip-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - equip-net

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: equip-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - equip-net

  # ===== FastAPI 后端 =====
  backend:
    build: ./backend
    image: equipment-system-backend:latest
    container_name: equip-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: /app/uploads
      TZ: ${TZ}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - equip-net

  # ===== 管理员专用照片审核服务（仅通过 Nginx 内网转发） =====
  photo-review:
    image: equipment-system-backend:latest
    container_name: equip-photo-review
    restart: unless-stopped
    working_dir: /app/photo_review
    command: ["python", "/app/photo_review/app.py"]
    environment:
      PHOTO_REVIEW_HOST: 0.0.0.0
      PHOTO_REVIEW_PORT: 8765
      PHOTO_REVIEW_NO_BROWSER: "1"
      PHOTO_REVIEW_REQUIRE_ADMIN_SESSION: "1"
      PHOTO_REVIEW_BASE_PATH: /photo-review
      LIUGUANG_DATA_DIR: /var/lib/field-note-photo-review
      PHOTO_REVIEW_SESSION_SECRET: ${PHOTO_REVIEW_SESSION_SECRET}
    volumes:
      - photo_review_data:/var/lib/field-note-photo-review
    depends_on:
      - backend
    networks:
      - equip-net

  # ===== Nginx 前端 + 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: equip-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - backend
      - photo-review
    networks:
      - equip-net

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  photo_review_data:

networks:
  equip-net:
    driver: bridge
