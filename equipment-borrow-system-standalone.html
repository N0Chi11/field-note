<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新媒体中心 器材设备借用系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F4EE;
  --bg-card: #FFFFFF;
  --bg-sidebar: #EEEDE5;
  --bg-hover: #E8E6DD;
  --bg-input: #FAF9F5;
  --accent: #D97757;
  --accent-hover: #C4663D;
  --accent-light: #F9E8E0;
  --accent-bg: #FDF4F0;
  --accent-gradient: linear-gradient(135deg, #D97757, #C4663D);
  --text: #2D2A26;
  --text-secondary: #6B6A63;
  --text-tertiary: #A09E95;
  --border: #E0DED5;
  --border-light: #ECEAE2;
  --success: #4A8B5C;
  --success-bg: #EAF3EC;
  --warning: #B8862B;
  --warning-bg: #F7F0E0;
  --danger: #C25B5B;
  --danger-bg: #F8EAEA;
  --info: #4A7CB5;
  --info-bg: #EAF0F8;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.04);
  --shadow-accent: 0 4px 12px rgba(217,119,87,0.2);
  --font: "Source Serif 4", Georgia, "Times New Roman", "Songti SC", "STSong", serif;
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Login */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(-45deg, #F5F4EE, #EEEDE5, #FDF4F0, #F0EDE5, #F5F4EE); background-size: 400% 400%; animation: gradientShift 20s ease infinite; padding: 20px; position: relative; }
.login-page::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(circle at 20% 30%, rgba(217,119,87,0.04) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(74,124,181,0.03) 0%, transparent 50%); pointer-events: none; }
.login-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.6); border-radius: var(--radius-lg); padding: 44px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); animation: scaleIn 0.4s ease; position: relative; z-index: 1; }
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo-icon { width: 56px; height: 56px; background: var(--accent-gradient); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px; box-shadow: var(--shadow-accent); }
.login-logo-text { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.login-logo-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.login-tabs { display: flex; gap: 4px; background: var(--bg-input); border-radius: var(--radius); padding: 4px; margin-bottom: 24px; }
.login-tabs button { flex: 1; padding: 10px; border: none; background: transparent; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all var(--transition); font-family: var(--font-ui); font-weight: 500; }
.login-tabs button.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow); }
.login-hint { font-size: 12px; color: var(--text-tertiary); text-align: center; margin-top: 16px; line-height: 1.6; }

/* Layout */
.app-layout { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; animation: slideInLeft 0.3s ease; }
.sidebar-header { padding: 22px 22px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-light); }
.logo-icon { width: 36px; height: 36px; background: var(--accent-gradient); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: var(--shadow-accent); flex-shrink: 0; }
.logo-text { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.2px; }
.logo-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
.sidebar-nav { flex: 1; padding: 10px 12px; }
.nav-section-title { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.6px; padding: 16px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; font-size: 14px; text-decoration: none; margin-bottom: 2px; font-weight: 500; position: relative; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: var(--accent); border-radius: 2px; }
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: var(--accent); color: white; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; min-width: 20px; text-align: center; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border-light); }
.user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.user-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; flex-shrink: 0; box-shadow: var(--shadow-accent); }
.user-name { font-size: 13px; font-weight: 600; color: var(--text); }
.user-id { font-size: 12px; color: var(--text-tertiary); }
.user-role { font-size: 10px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.logout-btn { width: 100%; padding: 9px; border: 1px solid var(--border); background: var(--bg-card); border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer; font-size: 13px; font-family: var(--font-ui); font-weight: 500; transition: all var(--transition); }
.logout-btn:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.main-content { flex: 1; margin-left: 260px; padding: 36px 44px; max-width: 100%; overflow-x: hidden; animation: fadeIn 0.3s ease; }

/* Page Header */
.page-header { margin-bottom: 28px; animation: slideUp 0.3s ease; }
.page-header h1 { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -0.4px; }
.page-header p { font-size: 14px; color: var(--text-secondary); }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: all var(--transition); }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.stat-card.stat-pending::before { background: var(--warning); }
.stat-card.stat-borrowing::before { background: var(--accent); }
.stat-card.stat-return::before { background: var(--info); }
.stat-card.stat-total::before { background: var(--text-tertiary); }
.stat-card.stat-active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow-md); transform: translateY(-2px); }
.stat-card.stat-active::after { content: '✓'; position: absolute; top: 8px; right: 10px; font-size: 14px; color: var(--accent); font-weight: 700; }
.stat-icon { font-size: 20px; margin-bottom: 6px; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.stat-label { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* Filter */
.filter-tabs { display: flex; gap: 6px; margin-top: 18px; flex-wrap: wrap; }
.filter-tab { padding: 7px 16px; border: 1px solid var(--border); background: var(--bg-card); border-radius: 20px; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all var(--transition); font-family: var(--font-ui); font-weight: 500; }
.filter-tab:hover { background: var(--bg-hover); border-color: var(--text-tertiary); }
.filter-tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: var(--shadow-accent); }

/* Forms */
.form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; max-width: 620px; box-shadow: var(--shadow); animation: slideUp 0.3s ease; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 7px; }
.form-group .label-hint { font-size: 12px; color: var(--text-tertiary); font-weight: 400; margin-left: 6px; }
input[type="text"], input[type="password"], input[type="datetime-local"], input[type="date"], input[type="email"], select, textarea { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-input); font-size: 14px; color: var(--text); font-family: var(--font-ui); transition: all var(--transition); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--bg-card); box-shadow: 0 0 0 3px var(--accent-light); }
input[readonly] { background: var(--bg-hover); color: var(--text-secondary); cursor: default; border-color: var(--border-light); }
textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
select { cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Buttons */
.btn { padding: 11px 22px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: all var(--transition); font-family: var(--font-ui); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--accent-gradient); color: white; box-shadow: var(--shadow-accent); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(217,119,87,0.3); }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-hover); border-color: var(--text-tertiary); }
.btn-success { background: linear-gradient(135deg, #4A8B5C, #3A7A4C); color: white; box-shadow: 0 2px 8px rgba(74,139,92,0.2); }
.btn-success:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74,139,92,0.3); }
.btn-danger { background: linear-gradient(135deg, #C25B5B, #A84848); color: white; box-shadow: 0 2px 8px rgba(194,91,91,0.2); }
.btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(194,91,91,0.3); }
.btn-sm { padding: 7px 14px; font-size: 13px; }
.btn-block { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

/* Equipment */
.equipment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.equipment-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow); animation: slideUp 0.4s ease backwards; }
.equipment-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--accent-light); }
.equipment-image { width: 100%; height: 190px; background: linear-gradient(135deg, var(--bg-input), var(--bg-hover)); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
.equipment-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
.equipment-card:hover .equipment-image img { transform: scale(1.05); }
.equipment-placeholder { font-size: 52px; filter: grayscale(0.2); }
.equipment-status-tag { position: absolute; top: 10px; right: 10px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; backdrop-filter: blur(8px); }
.equipment-status-tag.available { background: rgba(74,139,92,0.9); color: white; }
.equipment-status-tag.borrowed { background: rgba(217,119,87,0.9); color: white; }
.equipment-status-tag.repair { background: rgba(194,91,91,0.9); color: white; }
.equipment-info { padding: 18px; }
.equipment-code { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px; }
.equipment-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.equipment-category { font-size: 12px; color: var(--text-tertiary); }
.equipment-notes { font-size: 12px; color: var(--warning); background: var(--warning-bg); padding: 8px 12px; border-radius: var(--radius-sm); margin-top: 10px; line-height: 1.5; border-left: 3px solid var(--warning); }
.equipment-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

/* Status Badges */
.status-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
.urgency-tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 8px; animation: pulse 2s infinite; }
.urgency-tag.overdue { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
.urgency-tag.urgent { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
.urgency-tag.soon { background: var(--info-bg); color: var(--info); border: 1px solid var(--info); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.status-pending { background: var(--warning-bg); color: var(--warning); }
.status-pending::before { background: var(--warning); animation: pulse 2s infinite; }
.status-approved { background: var(--info-bg); color: var(--info); }
.status-approved::before { background: var(--info); }
.status-borrowing { background: var(--accent-light); color: var(--accent); }
.status-borrowing::before { background: var(--accent); animation: pulse 2s infinite; }
.status-return-pending { background: var(--warning-bg); color: var(--warning); }
.status-return-pending::before { background: var(--warning); animation: pulse 2s infinite; }
.status-returned { background: var(--success-bg); color: var(--success); }
.status-returned::before { background: var(--success); }
.status-rejected { background: var(--danger-bg); color: var(--danger); }
.status-rejected::before { background: var(--danger); }

/* Request Cards */
.request-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.request-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); transition: all var(--transition); animation: slideUp 0.3s ease backwards; }
.request-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-light); }
.request-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.work-order { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: 0.3px; }
.request-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 13px; }
.request-body .label { color: var(--text-tertiary); font-size: 12px; display: block; margin-bottom: 2px; }
.request-body .value { color: var(--text); font-weight: 500; }
.request-body .full { grid-column: 1 / -1; margin-top: 6px; }
.request-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-light); flex-wrap: wrap; }
.conflict-warning { background: var(--danger-bg); border: 1px solid var(--danger); border-left: 4px solid var(--danger); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; color: var(--danger); margin-top: 10px; display: none; font-weight: 500; }
.conflict-warning.show { display: block; animation: slideUp 0.2s ease; }

/* Category Section */
.category-section { margin-bottom: 32px; animation: slideUp 0.3s ease; }
.category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xs); }
.category-icon { font-size: 20px; }
.category-name { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; }
.category-count { font-size: 12px; color: var(--text-tertiary); background: var(--bg-input); padding: 3px 10px; border-radius: 20px; font-weight: 500; }

/* Profile */
.profile-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; max-width: 620px; box-shadow: var(--shadow); animation: slideUp 0.3s ease; }
.profile-header { display: flex; align-items: center; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--border-light); margin-bottom: 24px; }
.profile-avatar-large { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-gradient); color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; flex-shrink: 0; box-shadow: var(--shadow-accent); }
.profile-name { font-size: 22px; font-weight: 700; color: var(--text); }
.profile-id { font-size: 14px; color: var(--text-tertiary); margin-top: 2px; }
.profile-role-badge { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--accent-bg); color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
.profile-role-badge.user { background: var(--info-bg); color: var(--info); }
.profile-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.profile-stat { text-align: center; padding: 16px 8px; background: var(--bg-input); border-radius: var(--radius); }
.profile-stat-value { font-size: 26px; font-weight: 700; color: var(--text); }
.profile-stat-label { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.profile-actions { display: flex; gap: 12px; }
.profile-actions .btn { flex: 1; justify-content: center; }

/* Welcome Modal */
.welcome-modal { max-width: 540px; text-align: center; }
.welcome-icon { font-size: 48px; margin-bottom: 12px; animation: pulse 2s infinite; }
.welcome-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
.welcome-body { text-align: left; margin-bottom: 24px; }
.welcome-item { display: flex; gap: 12px; margin-bottom: 16px; padding: 16px; background: var(--bg-input); border-radius: var(--radius); border-left: 4px solid var(--accent); }
.welcome-num { width: 28px; height: 28px; background: var(--accent-gradient); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.welcome-text { font-size: 14px; color: var(--text); line-height: 1.8; }
.welcome-text strong { color: var(--accent); }

/* Memory Card Selection */
.memory-card-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
.memory-card-option { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 2px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all var(--transition); background: var(--bg-input); }
.memory-card-option:hover { border-color: var(--accent-light); background: var(--accent-bg); }
.memory-card-option.checked { border-color: var(--accent); background: var(--accent-bg); }
.memory-card-option.disabled { opacity: 0.5; cursor: not-allowed; }
.memory-card-option input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.memory-card-content { flex: 1; }
.memory-card-name { font-size: 14px; font-weight: 600; color: var(--text); }
.memory-card-id { font-size: 12px; color: var(--accent); font-weight: 600; }
.memory-card-notes { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
.memory-card-borrowed { display: inline-block; font-size: 11px; color: var(--danger); background: var(--danger-bg); padding: 2px 8px; border-radius: 10px; margin-top: 4px; font-weight: 600; }

/* Precautions */
.precautions-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px; max-width: 820px; box-shadow: var(--shadow); animation: slideUp 0.3s ease; }
.precautions-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }

function fmt(dateStr) { if (!dateStr) return '-'; const d = new Date(dateStr); return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function generateWorkOrder() { const now = new Date(); const date = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0'); const requests = store.get('eb_requests', []); let count = requests.filter(r => r.workOrderNo && r.workOrderNo.includes(date)).length + 1; let wo; do { wo = 'WO' + date + String(count).padStart(3, '0') + String(Math.floor(Math.random() * 36)).toString(36); count++; } while (requests.find(r => r.workOrderNo === wo)); return wo; }
function generateRequestId() { return 'R' + Date.now() + Math.floor(Math.random() * 1000); }
function getEquipmentById(id) { return store.get('eb_equipment', []).find(e => e.id === id); }
function getEquipmentName(id) { const eq = getEquipmentById(id); return eq ? eq.id + ' - ' + eq.name : id; }
function getCardById(id) { return store.get('eb_cards', []).find(c => c.id === id); }
function getCardName(id) { const c = getCardById(id); return c ? c.id + ' - ' + c.name : id; }
function addLog(action, detail, targetId) { var logs = store.get('eb_logs', []); logs.unshift({ id: 'L' + Date.now() + Math.floor(Math.random()*1000), time: new Date().toISOString(), actorName: state.user ? state.user.name : '系统', actorId: state.user ? (state.user.studentId || state.user.id) : 'system', actorIsAdmin: isAdmin(), action: action, detail: detail, targetId: targetId || '' }); if (logs.length > 500) logs = logs.slice(0, 500); store.set('eb_logs', logs); }
function fmtLogTime(iso) { var d = new Date(iso); if (isNaN(d.getTime())) return ''; var now = new Date(); var diff = now - d; if (diff < 60000) return '刚刚'; if (diff < 3600000) return Math.floor(diff/60000) + '分钟前'; if (diff < 86400000) return Math.floor(diff/3600000) + '小时前'; if (diff < 604800000) return Math.floor(diff/86400000) + '天前'; return (d.getMonth()+1) + '.' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function getInitials(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
function isEquipmentBorrowed(equipmentId) { const requests = store.get('eb_requests', []); return requests.some(r => r.equipmentId === equipmentId && r.status === 'borrowing'); }
function getCurrentBorrower(equipmentId) { const requests = store.get('eb_requests', []); return requests.find(r => r.equipmentId === equipmentId && r.status === 'borrowing'); }
function getReturnUrgencyTag(r) { if (r.status !== 'borrowing') return ''; const now = Date.now(); const returnTs = toTs(r.returnTime); if (isNaN(returnTs)) return ''; const diff = returnTs - now; if (diff < 0) return '<span class="urgency-tag overdue">已逾期 ' + Math.ceil(-diff / 3600000) + ' 小时</span>'; if (diff < 3600000 * 24) return '<span class="urgency-tag urgent">今日到期</span>'; if (diff < 3600000 * 48) return '<span class="urgency-tag soon">明日到期</span>'; return ''; }
function getEquipmentByCategory() { const equipment = store.get('eb_equipment', []); const groups = {}; const order = []; equipment.forEach(e => { if (!groups[e.category]) { groups[e.category] = []; order.push(e.category); } groups[e.category].push(e); }); return order.map(cat => ({ category: cat, items: groups[cat] })); }
function nowLocalISO() { const n = new Date(); const tz = n.getTimezoneOffset() * 60000; return new Date(n - tz).toISOString().slice(0, 16); }
function saveBorrowDraft() { try { const form = document.getElementById('form-borrow'); if (form) { const data = new FormData(form); state.borrowForm = { equipmentId: data.get('equipmentId') || '', borrowTime: data.get('borrowTime') || '', returnTime: data.get('returnTime') || '', reason: data.get('reason') || '' }; } sessionStorage.setItem('eb_borrow_draft', JSON.stringify(state.borrowForm)); } catch {} }
function loadBorrowDraft() { try { const saved = sessionStorage.getItem('eb_borrow_draft'); if (saved) { state.borrowForm = JSON.parse(saved); } } catch {} }
function checkStorageUsage() { let total = 0; for (let key in localStorage) { if (localStorage.hasOwnProperty(key)) { try { total += (localStorage[key] || '').length; } catch {} } } const maxBytes = 5 * 1024 * 1024; if (total > maxBytes * 0.8) { showToast('存储空间已使用 ' + Math.round(total / 1024) + 'KB，建议导出数据后清理旧记录', 'warning'); } return total; }
function exportCSV() { const requests = store.get('eb_requests', []); const equipment = store.get('eb_equipment', []); const cards = store.get('eb_cards', []); const eqName = id => { const e = equipment.find(x => x.id === id); return e ? e.name : id; }; const cardName = id => { const c = cards.find(x => x.id === id); return c ? c.name : ''; }; const rows = [['工单号','借用人','学号','设备','配套内存卡','借用时间','归还时间','借用理由','状态','审批人','审批备注','创建时间']]; requests.forEach(r => { rows.push([r.workOrderNo, r.borrowerName, r.borrowerId, eqName(r.equipmentId), cardName(r.cardId || ''), r.borrowTime, r.returnTime, r.reason, STATUS_TEXT[r.status] || r.status, r.approverName || '', r.adminComment || '', r.createdAt]); }); const csv = '\uFEFF' + rows.map(row => row.map(cell => { const s = String(cell || ''); return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n'); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = '借用记录_' + new Date().toISOString().slice(0,10) + '.csv'; a.click(); URL.revokeObjectURL(url); showToast('CSV已导出', 'success'); }

function resizeImage(file, maxSize, callback) {
  const reader = new FileReader();
  reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'); let { width, height } = img; if (width > height) { if (width > maxSize) { height = height * maxSize / width; width = maxSize; } } else { if (height > maxSize) { width = width * maxSize / height; height = maxSize; } } canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height); callback(canvas.toDataURL('image/jpeg', 0.85)); }; img.onerror = function() { showToast('图片加载失败，请重试', 'error'); }; img.src = e.target.result; };
  reader.onerror = function() { showToast('文件读取失败', 'error'); };
  reader.readAsDataURL(file);
}
function showToast(msg, type) { const toast = document.createElement('div'); toast.className = 'toast ' + (type || ''); toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(10px)'; setTimeout(() => toast.remove(), 300); }, 3000); }
window.handleImageUpload = function(event, type) { const file = event.target.files[0]; if (!file) return; if (!file.type.startsWith('image/')) { showToast('请上传图片文件', 'error'); return; } if (file.size > 10 * 1024 * 1024) { showToast('图片大小不能超过10MB', 'error'); return; } resizeImage(file, type === 'equipment' ? 600 : 800, function(dataUrl) { if (type === 'equipment') state.equipmentImagePreview = dataUrl; else state.returnPhotoPreview = dataUrl; render(); }); };

  else if (filter === 'active') filtered = requests.filter(r => ['approved','borrowing','return-pending'].includes(r.status));
  else if (filter === 'returned') filtered = requests.filter(r => r.status === 'returned');

    if (isAdmin() && r.status === 'return-pending') actions = '<button class="btn btn-success btn-sm" data-action="confirm-return" data-id="' + esc(r.id) + '">确认归还</button>';
    if (isAdmin()) actions += '<button class="btn btn-danger btn-sm" data-action="delete-request" data-id="' + esc(r.id) + '">删除</button>';
    const returnPhoto = r.returnPhoto ? '<div class="full"><span class="label">归还照片</span><img src="' + r.returnPhoto + '" class="return-photo-display" style="cursor:pointer" data-action="view-photo" data-src="' + r.returnPhoto + '"></div>' : '';

  }).join('');

}

/* View: Admin Approval */
function viewAdminApproval() {
  const requests = store.get('eb_requests', []);
  const stats = { pending: requests.filter(r => r.status === 'pending').length, borrowing: requests.filter(r => r.status === 'borrowing').length, returnPending: requests.filter(r => r.status === 'return-pending').length, total: requests.length };
  const filter = state.adminApprovalFilter || 'pending';
  let filtered;
  if (filter === 'pending') filtered = requests.filter(r => r.status === 'pending');
  else if (filter === 'borrowing') filtered = requests.filter(r => r.status === 'borrowing');
  else if (filter === 'return-pending') filtered = requests.filter(r => r.status === 'return-pending');
  else if (filter === 'all') filtered = requests;
  else filtered = requests.filter(r => r.status === 'pending' || r.status === 'approved');
  filtered = filtered.sort((a, b) => toTs(b.createdAt) - toTs(a.createdAt));
  const cards = filtered.map((r, i) => {
    const dc = checkConflictDetailed(r.equipmentId, r.borrowTime, r.returnTime, r.id);
    let conflictWarn = '';
    if (dc.hard.length > 0) conflictWarn = '<div class="conflict-warning show">🔴 强冲突：' + dc.hard.map(c => esc(c.workOrderNo)).join('、') + '</div>';
    else if (dc.soft.length > 0) conflictWarn = '<div class="conflict-warning show" style="border-color:var(--warning);background:rgba(184,134,43,0.08);">🟡 轻度冲突：' + dc.soft.map(c => esc(c.workOrderNo)).join('、') + '</div>';
    let actions = '';
    if (r.status === 'pending') actions = '<button class="btn btn-success btn-sm" data-action="open-approval-modal" data-id="' + esc(r.id) + '">审批</button><button class="btn btn-danger btn-sm" data-action="open-reject-modal" data-id="' + esc(r.id) + '">拒绝</button>';
    if (r.status === 'approved') actions = '<button class="btn btn-primary btn-sm" data-action="confirm-pickup" data-id="' + esc(r.id) + '">确认已领取</button>';
    if (r.status === 'return-pending') actions = '<button class="btn btn-success btn-sm" data-action="confirm-return" data-id="' + esc(r.id) + '">确认归还完成</button>';
    actions += '<button class="btn btn-danger btn-sm" data-action="delete-request" data-id="' + esc(r.id) + '">删除</button>';
    const approverInfo = r.approverName ? '<div><span class="label">审批人</span><span class="value">' + esc(r.approverName) + '</span></div>' : '';
    const cardInfo = r.cardId ? '<div><span class="label">配套内存卡</span><span class="value">💾 ' + esc(getCardName(r.cardId)) + '</span></div>' : '';
    return '<div class="request-card" style="animation-delay:' + (i * 0.03) + 's"><div class="request-header"><span class="work-order">' + esc(r.workOrderNo) + '</span><span class="status-badge status-' + esc(r.status) + '">' + STATUS_TEXT[r.status] + '</span>' + getReturnUrgencyTag(r) + '</div><div class="request-body"><div><span class="label">借用设备</span><span class="value">' + esc(getEquipmentName(r.equipmentId)) + '</span></div><div><span class="label">借用人</span><span class="value">' + esc(r.borrowerName) + '（' + esc(r.borrowerId) + '）</span></div><div><span class="label">借用时间</span><span class="value">' + fmt(r.borrowTime) + '</span></div><div><span class="label">归还时间</span><span class="value">' + fmt(r.returnTime) + '</span></div>' + approverInfo + cardInfo + '<div class="full"><span class="label">借用理由</span><span class="value">' + esc(r.reason) + '</span></div>' + (r.adminComment ? '<div class="full"><span class="label">审批备注</span><span class="value">' + esc(r.adminComment) + '</span></div>' : '') + '</div>' + conflictWarn + (actions ? '<div class="request-actions">' + actions + '</div>' : '') + '</div>';
  }).join('');
  const filterLabels = { 'active': '待审+已通过', 'pending': '待审核', 'borrowing': '借用中', 'return-pending': '待归还确认', 'all': '全部' };
  const statCards = '<div class="stats-grid">' +
    '<div class="stat-card stat-pending' + (filter === 'pending' ? ' stat-active' : '') + '" data-action="set-approval-filter" data-filter="pending" style="cursor:pointer"><div class="stat-icon">⏳</div><div class="stat-value">' + stats.pending + '</div><div class="stat-label">待审核</div></div>' +
    '<div class="stat-card stat-borrowing' + (filter === 'borrowing' ? ' stat-active' : '') + '" data-action="set-approval-filter" data-filter="borrowing" style="cursor:pointer"><div class="stat-icon">📦</div><div class="stat-value">' + stats.borrowing + '</div><div class="stat-label">借用中</div></div>' +
    '<div class="stat-card stat-return' + (filter === 'return-pending' ? ' stat-active' : '') + '" data-action="set-approval-filter" data-filter="return-pending" style="cursor:pointer"><div class="stat-icon">🔄</div><div class="stat-value">' + stats.returnPending + '</div><div class="stat-label">待归还确认</div></div>' +
    '<div class="stat-card stat-total' + (filter === 'all' ? ' stat-active' : '') + '" data-action="set-approval-filter" data-filter="all" style="cursor:pointer"><div class="stat-icon">📊</div><div class="stat-value">' + stats.total + '</div><div class="stat-label">总申请数</div></div>' +
    '</div>';
  const emptyText = { 'pending': '暂无待审核的申请', 'borrowing': '暂无借用中的设备', 'return-pending': '暂无待归还确认的记录', 'all': '暂无借用记录' };
  return '<div class="page-header"><h1>借用审批</h1><p>审核借用申请并确认设备领取 · 当前筛选：' + filterLabels[filter] + '</p></div>' + statCards + (filtered.length === 0 ? '<div class="empty-state"><div class="icon">✅</div><p>' + (emptyText[filter] || '暂无记录') + '</p></div>' : '<div class="request-list">' + cards + '</div>');
}

/* Modal: Timeline (Gantt) */
function viewTimelineModal() {
  const eq = getEquipmentById(state.timelineEquipmentId);
  if (!eq) return '';
  const requests = store.get('eb_requests', []).filter(r => r.equipmentId === eq.id && r.status !== 'rejected').sort((a, b) => toTs(a.borrowTime) - toTs(b.borrowTime));
  const borrowed = isEquipmentBorrowed(eq.id);
  const currentBorrower = getCurrentBorrower(eq.id);
  const statusCard = borrowed ? '<div class="timeline-status-card borrowed"><div style="font-size:24px;">📦</div><div class="timeline-status-text"><strong>当前状态：借用中</strong><span class="sub">借用人：' + currentBorrower.borrowerName + '（' + currentBorrower.borrowerId + '）· 预计归还：' + fmt(currentBorrower.returnTime) + '</span></div></div>' : '<div class="timeline-status-card available"><div style="font-size:24px;">✅</div><div class="timeline-status-text"><strong>当前状态：可借用</strong><span class="sub">设备目前可提交借用申请</span></div></div>';
  const range = state.ganttRange;
  const now = new Date();
  let startDate, endDate, tickCount, tickStep;
  if (range === 'month') { startDate = new Date(now.getFullYear(), now.getMonth(), 1); endDate = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59); tickCount = 5; tickStep = Math.ceil(endDate.getDate() / tickCount); }
  else if (range === 'quarter') { const q = Math.floor(now.getMonth() / 3); startDate = new Date(now.getFullYear(), q * 3, 1); endDate = new Date(now.getFullYear(), q * 3 + 3, 0, 23, 59); tickCount = 3; }
  else { startDate = new Date(now.getFullYear(), 0, 1); endDate = new Date(now.getFullYear(), 11, 31, 23, 59); tickCount = 4; }
  const totalMs = endDate - startDate;
  function dateToPercent(dateStr) { const d = new Date(dateStr); if (isNaN(d.getTime())) return 0; const clamped = Math.max(startDate, Math.min(endDate, d)); return ((clamped - startDate) / totalMs) * 100; }
  let ticksHtml = '';
  if (range === 'month') { for (let i = 0; i <= tickCount; i++) { const day = 1 + i * tickStep; if (day > endDate.getDate()) break; const tickDate = new Date(now.getFullYear(), now.getMonth(), day); const pct = dateToPercent(tickDate); ticksHtml += '<div class="gantt-header-tick" style="left:' + pct + '%;">' + day + '日</div>'; } }
  else if (range === 'quarter') { const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']; const q = Math.floor(now.getMonth() / 3); for (let i = 0; i < 3; i++) { const m = q * 3 + i; const tickDate = new Date(now.getFullYear(), m, 1); const pct = dateToPercent(tickDate); ticksHtml += '<div class="gantt-header-tick" style="left:' + pct + '%;">' + months[m] + '</div>'; } }
  else { const months = ['1月','4月','7月','10月']; for (let i = 0; i < 4; i++) { const tickDate = new Date(now.getFullYear(), i * 3, 1); const pct = dateToPercent(tickDate); ticksHtml += '<div class="gantt-header-tick" style="left:' + pct + '%;">' + months[i] + '</div>'; } }
  const todayPct = dateToPercent(now);
  const todayLine = (todayPct >= 0 && todayPct <= 100) ? '<div class="gantt-grid-line today" style="left:' + todayPct + '%;"></div><div class="gantt-today-label" style="left:' + todayPct + '%;">今天</div>' : '';
  let gridLines = '';
  if (range === 'month') { for (let i = 1; i <= tickCount; i++) { const day = 1 + i * tickStep; if (day > endDate.getDate()) break; const tickDate = new Date(now.getFullYear(), now.getMonth(), day); const pct = dateToPercent(tickDate); gridLines += '<div class="gantt-grid-line" style="left:' + pct + '%;"></div>'; } }
  else if (range === 'quarter') { const q = Math.floor(now.getMonth() / 3); for (let i = 1; i < 3; i++) { const m = q * 3 + i; const tickDate = new Date(now.getFullYear(), m, 1); const pct = dateToPercent(tickDate); gridLines += '<div class="gantt-grid-line" style="left:' + pct + '%;"></div>'; } }
  else { for (let i = 1; i < 4; i++) { const tickDate = new Date(now.getFullYear(), i * 3, 1); const pct = dateToPercent(tickDate); gridLines += '<div class="gantt-grid-line" style="left:' + pct + '%;"></div>'; } }
  const rangeRequests = requests.filter(r => { const bStart = toTs(r.borrowTime); const rEnd = toTs(r.returnTime); return bStart <= endDate.getTime() && rEnd >= startDate.getTime(); });
  const bars = rangeRequests.map(r => { const leftPct = dateToPercent(r.borrowTime); const rightPct = dateToPercent(r.returnTime); const widthPct = Math.max(rightPct - leftPct, 2); const barText = esc(r.borrowerName) + (r.status === 'borrowing' ? ' · 借用中' : r.status === 'returned' ? ' · 已归还' : ''); return '<div class="gantt-bar status-' + esc(r.status) + '" style="left:' + leftPct + '%; width:' + widthPct + '%;" title="' + esc(r.workOrderNo) + ' | ' + esc(r.borrowerName) + ' | ' + fmt(r.borrowTime) + ' → ' + fmt(r.returnTime) + '"><span class="gantt-bar-text">' + barText + '</span></div>'; }).join('');
  const noBars = rangeRequests.length === 0 ? '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--text-tertiary);">该时段暂无借用记录</div>' : '';
  const allHistory = requests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const historyHtml = allHistory.length > 0 ? allHistory.map(r => '<div class="gantt-history-item"><span class="status-badge status-' + r.status + '">' + STATUS_TEXT[r.status] + '</span><div style="flex:1;"><span class="work-order">' + esc(r.workOrderNo) + '</span> · ' + esc(r.borrowerName) + '（' + esc(r.borrowerId) + '） · ' + fmt(r.borrowTime) + ' → ' + fmt(r.returnTime) + '</div></div>').join('') : '';
  const img = eq.image ? '<img src="' + eq.image + '">' : '<div style="font-size:28px;">' + (eq.icon || '📦') + '</div>';
  return '<div class="modal-overlay" data-action="close-modal-bg"><div class="modal" style="max-width:760px;"><div class="modal-header"><div class="modal-title">设备借用时间轴</div><button class="modal-close" data-action="close-modal">×</button></div><div class="timeline-header"><div class="timeline-header-icon">' + img + '</div><div class="timeline-header-info"><h3>' + esc(eq.name) + '</h3><p>' + esc(eq.id) + ' · ' + eq.category + '</p></div></div>' + statusCard + '<div class="gantt-wrapper"><div class="gantt-toolbar"><button class="gantt-range-btn ' + (range === 'month' ? 'active' : '') + '" data-action="set-gantt-range" data-range="month">本月</button><button class="gantt-range-btn ' + (range === 'quarter' ? 'active' : '') + '" data-action="set-gantt-range" data-range="quarter">本季度</button><button class="gantt-range-btn ' + (range === 'year' ? 'active' : '') + '" data-action="set-gantt-range" data-range="year">本年</button></div><div class="gantt-container"><div class="gantt-chart"><div class="gantt-header"><div class="gantt-header-label">借用人 / 状态</div><div class="gantt-header-scale">' + ticksHtml + '</div></div><div class="gantt-row"><div class="gantt-row-label">' + (eq.name.length > 10 ? esc(eq.name.substring(0, 10)) + '…' : esc(eq.name)) + '</div><div class="gantt-row-track">' + gridLines + todayLine + bars + noBars + '</div></div></div><div class="gantt-legend"><div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#D97757;"></div>借用中</div><div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#4A7CB5;"></div>已通过</div><div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#B8862B;"></div>待审核/待归还</div><div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#4A8B5C;"></div>已归还</div><div class="gantt-legend-item"><div class="gantt-legend-dot" style="background:#C25B5B;width:2px;"></div>今天</div></div></div></div>' + (allHistory.length > 0 ? '<div class="gantt-history-list"><div class="gantt-history-title">完整借用记录</div>' + historyHtml + '</div>' : '') + '</div></div>';
}

/* Render */
function render() {
  const app = document.getElementById('app');
  if (!state.user) { app.innerHTML = viewLogin(); return; }
  let main = '';
  switch (state.view) {
    case 'equipment': main = viewEquipment(); break;
    case 'borrow': main = viewBorrow(); break;
    case 'overview': main = viewOverview(); break;
    case 'precautions': main = viewPrecautions(); break;
    case 'profile': main = viewProfile(); break;
    case 'admin-equipment': main = viewAdminEquipment(); break;
    case 'admin-approval': main = viewAdminApproval(); break;
    case 'admin-return': main = viewAdminReturn(); break;
    case 'admin-logs': main = viewAdminLogs(); break;
    default: main = viewEquipment();
  }
  let modal = '';
  if (state.showWelcome) modal = viewWelcomeModal();
  else if (state.modal === 'equipment') modal = viewEquipmentModal();
  else if (state.modal === 'return') modal = viewReturnModal();
  else if (state.modal === 'timeline') modal = viewTimelineModal();
  else if (state.modal === 'approval') modal = viewApprovalModal();
  else if (state.modal === 'reject') modal = viewRejectModal();
  else if (state.modal === 'card') modal = viewCardModal();
  else if (state.modal === 'pickup') modal = viewPickupModal();
  else if (state.modal === 'photo') modal = viewPhotoModal();
  app.innerHTML = viewSidebar() + '<main class="main-content">' + main + '</main>' + viewMobileNav() + modal;
}

/* Handlers */
function handleClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case 'switch-login-tab': state.loginTab = el.dataset.tab; render(); break;
    case 'navigate': if (!isAdmin() && el.dataset.view.startsWith('admin')) return; if (state.view === 'borrow') saveBorrowDraft(); state.view = el.dataset.view; if (el.dataset.view === 'borrow') loadBorrowDraft(); render(); break;
    case 'logout': logout(); render(); break;
    case 'toggle-sidebar': { var sb = document.querySelector('.sidebar'); if (sb) sb.classList.toggle('expanded'); break; }
    case 'set-filter': state.filter = el.dataset.filter; render(); break;
    case 'set-approval-filter': state.adminApprovalFilter = el.dataset.filter; render(); break;
    case 'set-log-filter': state.logFilter = el.dataset.filter; render(); break;
    case 'open-approval-modal': openApprovalModal(el.dataset.id); break;
    case 'confirm-approve': confirmApprove(el.dataset.id); break;
    case 'confirm-reject': confirmReject(el.dataset.id); break;
    case 'reject-request': openRejectModal(el.dataset.id); break;
    case 'open-reject-modal': openRejectModal(el.dataset.id); break;
    case 'search-input': state.searchQuery = el.value; break;
    case 'export-csv': exportCSV(); break;
    case 'view-photo': state.modal = 'photo'; state.photoViewUrl = el.dataset.src; render(); break;
    case 'confirm-pickup': openPickupModal(el.dataset.id); break;
    case 'confirm-pickup-with-card': confirmPickup(el.dataset.id); break;
    case 'confirm-return': confirmReturn(el.dataset.id); break;
    case 'delete-request': deleteRequest(el.dataset.id); break;
    case 'cancel-request': cancelRequest(el.dataset.id); break;
    case 'open-return-modal': openReturnModal(el.dataset.id); break;
    case 'open-timeline': openTimeline(el.dataset.eid); break;
    case 'set-gantt-range': state.ganttRange = el.dataset.range; render(); break;
    case 'open-add-equipment': state.editingEquipmentId = null; state.equipmentImagePreview = null; state.modal = 'equipment'; render(); break;
    case 'edit-equipment': state.editingEquipmentId = el.dataset.id; { const eqToEdit = getEquipmentById(el.dataset.id); state.equipmentImagePreview = eqToEdit ? eqToEdit.image || null : null; } state.modal = 'equipment'; render(); break;
    case 'delete-equipment': deleteEquipment(el.dataset.id); break;
    case 'open-add-card': state.editingCardId = null; state.modal = 'card'; render(); break;
    case 'edit-card': state.editingCardId = el.dataset.id; state.modal = 'card'; render(); break;
    case 'delete-card': deleteCard(el.dataset.id); break;
    case 'toggle-repair': toggleRepair(el.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'close-modal-bg': if (e.target === el) closeModal(); break;
    case 'close-welcome': state.showWelcome = false; render(); break;
    case 'close-welcome-bg': if (e.target === el) { state.showWelcome = false; render(); } break;
  }
}
function closeModal() { state.modal = null; state.modalData = null; state.equipmentImagePreview = null; state.editingEquipmentId = null; state.timelineEquipmentId = null; state.approvalData = { id: '', comment: '' }; state.rejectData = { id: '', comment: '' }; state.photoViewUrl = null; state.pickupData = { id: '', cardId: '' }; state.editingCardId = null; render(); }
function handleChange(e) {
  const el = e.target;
  if (el.dataset.action === 'check-conflict') { const form = document.getElementById('form-borrow'); if (form) { const data = new FormData(form); state.borrowForm.equipmentId = data.get('equipmentId') || ''; state.borrowForm.borrowTime = data.get('borrowTime') || ''; state.borrowForm.returnTime = data.get('returnTime') || ''; state.borrowForm.reason = data.get('reason') || ''; render(); } }
  if (el.dataset.action === 'approval-comment') { state.approvalData.comment = el.value; }
  if (el.dataset.action === 'reject-comment') { state.rejectData.comment = el.value; }
  if (el.dataset.action === 'pickup-card-select') { state.pickupData.cardId = el.value; }
}
function handleSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  switch (form.id) {
    case 'form-login': loginUser(data.get('name'), data.get('studentId')); render(); break;
    case 'form-admin-login': loginAdmin(data.get('adminName'), data.get('password')); render(); break;
    case 'form-borrow': submitBorrowForm(data); break;
    case 'form-equipment': submitEquipmentForm(data); break;
    case 'form-return': submitReturnForm(); break;
    case 'form-card': submitCardForm(data); break;
  }
}

/* Business Logic */
function submitBorrowForm(data) {
  const equipmentId = data.get('equipmentId'); const borrowTime = data.get('borrowTime'); const returnTime = data.get('returnTime'); const reason = data.get('reason'); const workOrder = data.get('workOrder') || generateWorkOrder();
  if (!equipmentId || !borrowTime || !returnTime || !reason) { showToast('请填写完整信息', 'error'); return; }
  if (new Date(borrowTime) < new Date()) { showToast('借用时间不能早于当前时间', 'error'); return; }
  if (new Date(borrowTime) >= new Date(returnTime)) { showToast('归还时间必须晚于借用时间', 'error'); return; }
  const eq = getEquipmentById(equipmentId);
  if (!eq) { showToast('该设备不存在', 'error'); return; }
  if (eq.status === 'repair') { showToast('该设备正在维修中，暂不可借用', 'error'); return; }
  const dc = checkConflictDetailed(equipmentId, borrowTime, returnTime, null);
  if (dc.hard.length > 0) { showToast('强冲突，该设备在所选时段已被借用', 'error'); return; }
  const requests = store.get('eb_requests', []);
  requests.push({ id: generateRequestId(), workOrderNo: workOrder, borrowerName: state.user.name, borrowerId: state.user.studentId || state.user.id, equipmentId: equipmentId, borrowTime: borrowTime, returnTime: returnTime, reason: reason, status: 'pending', adminComment: '', returnPhoto: null, createdAt: new Date().toISOString() });
  if (store.set('eb_requests', requests)) { showToast('申请已提交，请等待管理员审核', 'success'); addLog('提交申请', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(equipmentId) + ' · ' + fmt(borrowTime) + '→' + fmt(returnTime), r.id); state.borrowForm = { equipmentId: '', borrowTime: '', returnTime: '', reason: '' }; sessionStorage.removeItem('eb_borrow_draft'); state.view = 'overview'; checkStorageUsage(); render(); }
}
function openApprovalModal(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; state.modalData = r; state.approvalData = { id: id, comment: '' }; state.modal = 'approval'; render(); }
function confirmApprove(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; if (!validateTransition(r.status, 'approved')) { showToast('当前状态不允许此操作', 'error'); return; } const eq = getEquipmentById(r.equipmentId); if (eq && eq.status === 'repair') { showToast('该设备正在维修中，无法通过审批', 'error'); return; } const dc = checkConflictDetailed(r.equipmentId, r.borrowTime, r.returnTime, r.id); if (dc.hard.length > 0) { showToast('强冲突！该设备在此时段已被占用：' + dc.hard.map(c => c.workOrderNo).join('、'), 'error'); return; } r.status = 'approved'; r.approverName = state.user.name; r.adminComment = state.approvalData.comment || ''; if (store.set('eb_requests', requests)) { showToast('工单 ' + r.workOrderNo + ' 已通过', 'success'); addLog('审批通过', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId) + (r.adminComment ? ' · ' + r.adminComment : ''), r.id); closeModal(); } }
function openRejectModal(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; state.modalData = r; state.rejectData = { id: id, comment: '' }; state.modal = 'reject'; render(); }
function confirmReject(id) { if (!state.rejectData.comment || !state.rejectData.comment.trim()) { showToast('请填写拒绝理由', 'error'); return; } const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; r.status = 'rejected'; r.approverName = state.user.name; r.adminComment = state.rejectData.comment.trim(); if (store.set('eb_requests', requests)) { showToast('工单 ' + r.workOrderNo + ' 已拒绝', 'warning'); addLog('拒绝申请', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId) + ' · 理由：' + r.adminComment, r.id); closeModal(); checkStorageUsage(); } }
function rejectRequest(id) { openRejectModal(id); }
function openPickupModal(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; state.modalData = r; state.pickupData = { id: id, cardId: '' }; state.modal = 'pickup'; render(); }
function confirmPickup(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; if (!validateTransition(r.status, 'borrowing')) { showToast('当前状态不允许此操作', 'error'); return; } r.status = 'borrowing'; var cardId = state.pickupData.cardId || ''; if (cardId) { r.cardId = cardId; var cards = store.get('eb_cards', []); var card = cards.find(c => c.id === cardId); if (card) { card.status = 'borrowed'; store.set('eb_cards', cards); } } if (store.set('eb_requests', requests)) { showToast('已确认领取，工单 ' + r.workOrderNo + ' 状态：借用中' + (cardId ? '（已配卡：' + getCardName(cardId) + '）' : ''), 'success'); addLog('确认领取', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId) + (cardId ? ' · 配卡 ' + getCardName(cardId) : ''), r.id); closeModal(); } }
function openReturnModal(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; state.modalData = r; if (!state.returnPhotoPreview) state.returnPhotoPreview = r.returnPhoto || null; state.modal = 'return'; render(); }
function submitReturnForm() { if (!state.returnPhotoPreview) { showToast('请上传归还照片', 'error'); return; } const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === state.modalData.id); if (!r) return; if (!validateTransition(r.status, 'return-pending')) { showToast('当前状态不允许此操作', 'error'); return; } r.status = 'return-pending'; r.returnPhoto = state.returnPhotoPreview; if (store.set('eb_requests', requests)) { state.returnPhotoPreview = null; showToast('归还申请已提交，等待管理员确认', 'success'); addLog('提交归还', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId), r.id); closeModal(); checkStorageUsage(); } }
function confirmReturn(id) { const requests = store.get('eb_requests', []); const r = requests.find(x => x.id === id); if (!r) return; if (!validateTransition(r.status, 'returned')) { showToast('当前状态不允许此操作', 'error'); return; } r.status = 'returned'; if (r.cardId) { var cards = store.get('eb_cards', []); var card = cards.find(c => c.id === r.cardId); if (card) { card.status = 'available'; store.set('eb_cards', cards); } } if (store.set('eb_requests', requests)) { showToast('工单 ' + r.workOrderNo + ' 归还确认完成', 'success'); addLog('确认归还', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId) + (r.cardId ? ' · 卡 ' + getCardName(r.cardId) + '已释放' : ''), r.id); render(); } }
function releaseCardFromRequest(r) { if (r.cardId && r.status === 'borrowing') { var cards = store.get('eb_cards', []); var card = cards.find(c => c.id === r.cardId); if (card) { card.status = 'available'; store.set('eb_cards', cards); } } }
function deleteRequest(id) { if (!confirm('确认删除此借用记录？此操作不可撤销。')) return; var requests = store.get('eb_requests', []); var r = requests.find(x => x.id === id); if (r) releaseCardFromRequest(r); if (store.set('eb_requests', requests.filter(x => x.id !== id))) { showToast('借用记录已删除', 'success'); if (r) addLog('删除记录', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId), r.id); render(); } }
function cancelRequest(id) { if (!confirm('确认取消此借用申请？')) return; var requests = store.get('eb_requests', []); var r = requests.find(x => x.id === id); if (r) releaseCardFromRequest(r); if (store.set('eb_requests', requests.filter(x => x.id !== id))) { showToast('申请已取消', 'success'); if (r) addLog('取消申请', '工单 ' + r.workOrderNo + ' · ' + getEquipmentName(r.equipmentId), r.id); render(); } }
function submitEquipmentForm(data) { const equipment = store.get('eb_equipment', []); const id = data.get('id').trim(); if (state.editingEquipmentId) { const eq = equipment.find(e => e.id === state.editingEquipmentId); if (eq) { const newStatus = data.get('status') || 'available'; if (newStatus === 'repair' && isEquipmentBorrowed(eq.id)) { showToast(eq.name + ' 正在被借用，无法设为维修', 'error'); return; } eq.name = data.get('name').trim(); eq.category = data.get('category').trim(); eq.icon = data.get('icon').trim() || '📦'; eq.notes = data.get('notes').trim(); eq.status = newStatus; if (state.equipmentImagePreview) eq.image = state.equipmentImagePreview; } if (store.set('eb_equipment', equipment)) { showToast('设备信息已更新', 'success'); if (eq) addLog('编辑设备', eq.id + ' - ' + eq.name, eq.id); closeModal(); } } else { if (equipment.find(e => e.id === id)) { showToast('设备编号已存在', 'error'); return; } equipment.push({ id: id, name: data.get('name').trim(), category: data.get('category').trim(), icon: data.get('icon').trim() || '📦', image: state.equipmentImagePreview, notes: data.get('notes').trim(), status: data.get('status') || 'available' }); if (store.set('eb_equipment', equipment)) { showToast('设备已添加', 'success'); addLog('添加设备', id + ' - ' + data.get('name').trim(), id); closeModal(); } } }
function deleteEquipment(id) { const activeRequests = store.get('eb_requests', []).filter(r => r.equipmentId === id && ACTIVE_STATUSES.includes(r.status)); if (activeRequests.length > 0) { showToast('该设备有 ' + activeRequests.length + ' 条进行中的借用记录，无法删除', 'error'); return; } if (!confirm('确认删除此设备？相关历史借用记录将保留但不再显示设备名称。')) return; var eqName = getEquipmentName(id); var ok = store.set('eb_equipment', store.get('eb_equipment', []).filter(e => e.id !== id)); if (ok) { if (state.borrowForm.equipmentId === id) state.borrowForm.equipmentId = ''; showToast('设备已删除', 'success'); addLog('删除设备', eqName, id); render(); } }
function toggleRepair(id) { const equipment = store.get('eb_equipment', []); const eq = equipment.find(e => e.id === id); if (!eq) return; if (eq.status === 'repair') { eq.status = 'available'; if (store.set('eb_equipment', equipment)) { showToast(eq.name + ' 已设为可用', 'success'); addLog('设备设为可用', eq.id + ' - ' + eq.name, eq.id); render(); } } else { const activeRequests = store.get('eb_requests', []).filter(r => r.equipmentId === id && ACTIVE_STATUSES.includes(r.status)); if (activeRequests.length > 0) { showToast(eq.name + ' 有 ' + activeRequests.length + ' 条进行中的借用申请，无法设为维修', 'error'); return; } eq.status = 'repair'; if (store.set('eb_equipment', equipment)) { showToast(eq.name + ' 已设为维修中', 'warning'); addLog('设备设为维修', eq.id + ' - ' + eq.name, eq.id); render(); } } }
function openTimeline(eid) { state.timelineEquipmentId = eid; state.modal = 'timeline'; render(); }
function submitCardForm(data) { const cards = store.get('eb_cards', []); const id = data.get('id').trim(); if (state.editingCardId) { const c = cards.find(x => x.id === state.editingCardId); if (c) { c.name = data.get('name').trim(); c.notes = data.get('notes').trim(); } if (store.set('eb_cards', cards)) { showToast('内存卡信息已更新', 'success'); if (c) addLog('编辑内存卡', c.id + ' - ' + c.name, c.id); closeModal(); } } else { if (cards.find(x => x.id === id)) { showToast('卡编号已存在', 'error'); return; } cards.push({ id: id, name: data.get('name').trim(), status: 'available', notes: data.get('notes').trim() }); if (store.set('eb_cards', cards)) { showToast('内存卡已添加', 'success'); addLog('添加内存卡', id + ' - ' + data.get('name').trim(), id); closeModal(); } } }
function deleteCard(id) { const activeRequests = store.get('eb_requests', []).filter(r => r.cardId === id && ACTIVE_STATUSES.includes(r.status)); if (activeRequests.length > 0) { showToast('该卡有 ' + activeRequests.length + ' 条进行中的借用记录，无法删除', 'error'); return; } if (!confirm('确认删除此内存卡？')) return; var cardName = getCardName(id); if (store.set('eb_cards', store.get('eb_cards', []).filter(c => c.id !== id))) { showToast('内存卡已删除', 'success'); addLog('删除内存卡', cardName, id); render(); } }

/* Init */
function init() {
  const DATA_VERSION = 'v15';
  if (store.get('eb_data_version') !== DATA_VERSION) { store.set('eb_equipment', SEED_EQUIPMENT); store.set('eb_cards', SEED_CARDS); store.set('eb_requests', SEED_REQUESTS); store.set('eb_users', []); store.set('eb_data_version', DATA_VERSION); store.set('eb_session', null); store.set('eb_schema', SCHEMA_VERSION); }
  /* 数据完整性校验：检查 schema 版本和数据结构 */
  const currentSchema = store.get('eb_schema', 0);
  if (currentSchema < SCHEMA_VERSION) {
    console.warn('Schema version mismatch, running migration...');
    var eqs = store.get('eb_equipment', []);
    eqs.forEach(function(e) { if (!e.status) e.status = 'available'; if (!e.notes) e.notes = ''; });
    store.set('eb_equipment', eqs);
    var reqs = store.get('eb_requests', []);
    reqs.forEach(function(r) { if (!r.adminComment) r.adminComment = ''; if (!r.returnPhoto) r.returnPhoto = null; if (!r.status) r.status = 'pending'; if (!r.cardId) r.cardId = null; });
    store.set('eb_requests', reqs);
    var cards = store.get('eb_cards', []);
    if (!cards || cards.length === 0) { cards = SEED_CARDS; }
    cards.forEach(function(c) { if (!c.status) c.status = 'available'; if (!c.notes) c.notes = ''; });
    store.set('eb_cards', cards);
    store.set('eb_schema', SCHEMA_VERSION);
  }
  /* checksum 完整性检查 */
  var storedChecksum = store.get('eb_checksum', null);
  var currentChecksum = computeChecksum({ eq: store.get('eb_equipment', []), cards: store.get('eb_cards', []), req: store.get('eb_requests', []) });
  if (storedChecksum && storedChecksum !== currentChecksum) {
    console.warn('Data checksum mismatch - data may have been tampered with');
  }
  store.set('eb_checksum', currentChecksum);
  state.user = store.get('eb_session', null);
  if (state.user) { state.view = isAdmin() ? 'admin-approval' : 'equipment'; if (!sessionStorage.getItem('eb_welcome_shown')) { state.showWelcome = true; sessionStorage.setItem('eb_welcome_shown', '1'); } }
  const app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('change', handleChange);
  app.addEventListener('submit', handleSubmit);
  app.addEventListener('input', function(e) {
    var el = e.target;
    if (el.dataset && el.dataset.action === 'search-input') {
      if (state._composing) return;
      state.searchQuery = el.value;
      var listEl = document.getElementById('overview-list');
      if (listEl) { listEl.innerHTML = renderOverviewList(); }
    }
  });
  app.addEventListener('compositionstart', function(e) { if (e.target.dataset && e.target.dataset.action === 'search-input') state._composing = true; });
  app.addEventListener('compositionend', function(e) {
    if (e.target.dataset && e.target.dataset.action === 'search-input') {
      state._composing = false;
      state.searchQuery = e.target.value;
      var listEl = document.getElementById('overview-list');
      if (listEl) { listEl.innerHTML = renderOverviewList(); }
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (state.showWelcome) { state.showWelcome = false; render(); }
      else if (state.modal) { closeModal(); }
    }
  });
  render();
}
init();
</script>
